<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/global.css?v=20251214">
  <script src="js/config.js?v=20251214"></script>
  <script src="js/auth.js?v=20251214"></script>
  <script src="js/warning.js?v=20251214"></script>
  <script src="js/i18n.js?v=20251214"></script>
  <script src="js/theme.js?v=20251214"></script>
  <script src="js/footer.js?v=20251214"></script>
  <title>项目管理</title>
  <style>
    body {
      color: var(--text-main);
      scrollbar-color: var(--text-muted) var(--bg-color); 
    }

    .welcome-container {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 60px;
      margin-bottom: 40px;
      letter-spacing: -0.02em;
      background: var(--navy-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .project-description {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 60px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-muted);
    }
    
    .my-projects-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 16px;
      border-radius: 12px;
      background-color: var(--bg-color);
      overflow: hidden;
    }

    .my-projects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .my-projects-header h2 {
      font-size: 22px;
      font-weight: bold;
      background: linear-gradient(90deg, #60a5fa 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .new-project-button {
      padding: 8px 14px;
      font-size: 14px;
      background-color: #0073e6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .new-project-button:hover {
      background: #1a5edb;
    }

    .project-table-wrapper {
      max-height: 60vh;
      overflow: auto;
      max-width: 1000px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-color);
      overflow: hidden;
      box-shadow: 0 4px 20px var(--shadow-color);
    }

    .project-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .project-table th {
      background-color: var(--surface-color);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      border-right: none;
      border-left: none;
      border-top: none;
    }

    .project-table td {
      padding: 16px;
      color: var(--text-main);
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      border-right: none;
      border-left: none;
    }

    .project-table thead {
      background-color: var(--surface-color);
    }

    #noProjects {
      text-align: center;
      padding: 20px;
      color: #888;
    }

    .edit-button,
    .delete-button,
    .publish-button,
    .unpublish-button,
    .page-button {
      padding: 6px 16px;
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    .edit-button:hover,
    .delete-button:hover,
    .publish-button:hover,
    .unpublish-button:hover,
    .page-button:hover {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
      background-color: rgba(59, 130, 246, 0.05);
    }

    .pagination-container {
      display: none;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      gap: 10px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img id="logo" src="img/EdUHK_logo.png" alt="香港教育大学 Logo">
    </div>

    <div class="menu">
      <nav>
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="language_map.html">研究</a></li>
          <li><a href="contribute.html">贡献者</a></li>
        </ul>
      </nav>
    </div>

    <div class="header-right">
        <button id="themeToggle" class="theme-toggle-btn" title="切换主题">
            <img id="themeIconImg" src="img/theme.png" alt="Theme">
        </button>

        <div class="profile" id="profile">
            <img id="profileImg" src="img/profile.png" alt="头像">
            <span class="profile-name" id="userStatus">登录</span>
        </div>
    </div>

    <div id="dropdownMenu" class="dropdown-menu" style="display: none;">
      <a href="account.html">我的账户</a>
      <a href="projects.html">管理项目</a>
      <button class="dropdown-link" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <div class="welcome-container">
    <h1 id="profile-name"></h1>
  </div>

  <div class="project-description">
    我们致力于通过收集自带时间信息的词汇数据，通过历史比较的方法，推断汉藏语言或者方言的分化时间，并追踪可能的人类迁移路径，建立开放共享的词汇数据库，开展语言演化研究。
  </div>

  <div class="my-projects-container">
    <div class="my-projects-header">
      <h2>我的项目列表</h2>
      <button type="button" class="new-project-button" id="newProjectBtn">新建项目</button>
    </div>

    <div class="project-table-wrapper">
      <table class="project-table" id="projectTable">
        <thead>
          <tr>
            <th>项目名称</th>
            <th>词汇数量</th>
            <th>研究目标</th>
            <th>作者</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      
      <div id="noProjects">暂无项目</div>
    </div>

    <div class="pagination-container">
      <button type="button" id="prevPage" class="page-button">←</button>
      <span id="pageIndicator">第 1 页</span>
      <button type="button" id="nextPage" class="page-button">→</button>
    </div>
  </div>
</body>

<script>
  let currentPage = 1;
  const pageSize = 5;
  let totalPages = 1;

  const themeToggleBtn = document.getElementById('themeToggle');
  const moonIcon = document.getElementById('moonIcon');
  const sunIcon = document.getElementById('sunIcon');
  const logo = document.getElementById('logo');
  const htmlEl = document.documentElement;

  const savedTheme = localStorage.getItem('theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
    setDarkTheme();
  } else {
    setLightTheme();
  }

  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => {
      if (htmlEl.getAttribute('data-theme') === 'dark') {
        setLightTheme();
        localStorage.setItem('theme', 'light');
      } else {
        setDarkTheme();
        localStorage.setItem('theme', 'dark');
      }
    });
  }

  function setDarkTheme() {
    htmlEl.setAttribute('data-theme', 'dark');
    if (moonIcon) moonIcon.style.display = 'none';
    if (sunIcon) sunIcon.style.display = 'block';
    if (logo) logo.src = "img/EdUHK_logo_dark.png";
  }

  function setLightTheme() {
    htmlEl.removeAttribute('data-theme');
    if (moonIcon) moonIcon.style.display = 'block';
    if (sunIcon) sunIcon.style.display = 'none';
    if (logo) logo.src = "img/EdUHK_logo.png"; 
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (!Auth.isLoggedIn()) {
      window.location.href = "index.html?login=true";
      return;
    }

    Auth.init('#userStatus');
    Auth.bindProfileName('#userStatus');

    const userNameSpan = document.getElementById("profile-name");
    const cu = JSON.parse(sessionStorage.getItem("currentUser") || "null");
    const userName = (cu && cu.username) || sessionStorage.getItem("username") || "未知用户";
    const rawTitle = (cu && cu.title) || "";
    function getTitleKey(title) {
      const normalized = String(title || "").trim().toLowerCase();
      const titleMap = {
        "教授": "professor",
        "professor": "professor",
        "博士": "doctor",
        "doctor": "doctor",
        "dr": "doctor",
        "dr.": "doctor",
        "先生": "mr",
        "mr": "mr",
        "mr.": "mr",
        "女士": "ms",
        "ms": "ms",
        "ms.": "ms"
      };
      return titleMap[normalized] || "";
    }

    function getLocalizedTitle() {
      const key = getTitleKey(rawTitle);
      if (!key) return rawTitle;
      return window.I18N ? I18N.t(`auth.titles.${key}`, rawTitle) : rawTitle;
    }

    function getDisplayName() {
      const title = getLocalizedTitle();
      const locale = window.I18N?.locale || localStorage.getItem("site_locale") || "zh-cn";
      if (!title) return userName;
      return locale === "en-us" ? `${title} ${userName}` : `${userName}${title}`;
    }

    function renderWelcome() {
      const displayName = getDisplayName();
      if (window.I18N && I18N.setText) {
        I18N.setText(userNameSpan, "projects.welcome", "欢迎，{displayName}", { displayName });
      } else if (userNameSpan) {
        userNameSpan.textContent = `欢迎，${displayName}`;
      }
    }
    renderWelcome();
    document.addEventListener("i18n:changed", renderWelcome);

    const profile = document.getElementById("profile");
    const dropdown = document.getElementById("dropdownMenu");
    if (profile && dropdown) {
        profile.addEventListener('click', () => {
          dropdown.style.display = (dropdown.style.display === "none" || !dropdown.style.display)
          ? "block" : "none";
        });

        document.addEventListener("click", (e) => {
        if (!profile.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.style.display = "none";
        }
        });
    }

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        Auth.logout();
        setTimeout(() => {
          window.location.href = "index.html?logout=true";
        }, 100);
      });
    }

    document.getElementById("prevPage").addEventListener("click", () => {
      currentPage--;
      loadProjectList();
    });

    document.getElementById("nextPage").addEventListener("click", () => {
      currentPage++;
      loadProjectList();
    });
  });

  async function loadProjectList() {
    const tbody = document.querySelector("#projectTable tbody");
    const noProjects = document.getElementById("noProjects");

    tbody.innerHTML = "";

    const cu = JSON.parse(sessionStorage.getItem("currentUser") || "null");
    const myId = (cu && cu.id) || "anonymous";

    let projects = [];
    try {
      const resp = await fetch(
        `/api/projects?authorId=${encodeURIComponent(myId)}`
      );
      if (!resp.ok) {
        console.error("加载项目失败:", resp.status, await resp.text());
        pop_up("加载项目失败，请检查网络连接", "r");
        noProjects.style.display = "block";
        document.querySelector(".pagination-container").style.display = "none";
        return;
      }

      const data = await resp.json();
      projects = data.projects || [];
    } catch (err) {
      console.error("调用后端接口出错（GET /projects）:", err);
      pop_up("加载项目失败，请检查网络连接", "r");
      noProjects.style.display = "block";
      document.querySelector(".pagination-container").style.display = "none";
      return;
    }

    totalPages = Math.max(1, Math.ceil(projects.length / pageSize));
    const start = (currentPage - 1) * pageSize;

    if (projects.length === 0) {
      noProjects.style.display = "block";
      document.querySelector(".pagination-container").style.display = "none";
      return;
    }
    noProjects.style.display = "none";

    projects.slice(start, start + pageSize).forEach((proj) => {
      const tr = document.createElement("tr");

      const cuInner = JSON.parse(sessionStorage.getItem("currentUser") || "null");
      const fallbackAuthor = (cuInner && cuInner.username) || "未知用户";

      const projectName =
        proj.project_name || proj.projectName || "未命名项目";
      const authorName =
        proj.author || proj.author_name || fallbackAuthor;

      let createdAtText = "--";
      const rawCreated = proj.created_at || proj.createdAt;
      if (rawCreated) {
        try {
          const d = new Date(rawCreated);
          if (!isNaN(d.getTime())) {
            createdAtText = d.toLocaleString("zh-CN");
          } else {
            createdAtText = String(rawCreated);
          }
        } catch (e) {
          createdAtText = String(rawCreated);
        }
      }

      const isPublic = !!(proj.is_public ?? proj.isPublic);

      const vocabCount = (proj.numVocab ?? proj.num_vocab ?? 0);

      const projectTypeLabels = {
        "1": "目标语言与其他语言的分化时间",
        "2": "多个目标语言的分化时间",
        "3": "目标语言的不同方言的分化时间"
      };
      const typeRaw = (proj.project_type ?? proj.projectType);
      const typeKey = (typeRaw != null) ? String(typeRaw) : null;
      const researchTarget = typeKey ? (projectTypeLabels[typeKey] || "--") : "--";

      tr.innerHTML = `
        <td>${projectName}</td>
        <td>${vocabCount}</td>
        <td>${researchTarget}</td>
        <td>${authorName}</td>
        <td>${createdAtText}</td>
        <td>
          <button type="button" class="edit-button" data-id="${proj.id}">编辑</button>
          <button type="button" class="delete-button" data-id="${proj.id}">删除</button>
          <button type="button"
            class="publish-button" data-id="${proj.id}" ${isPublic ? 'style="display:none;"' : ""}>设为公开</button>
          <button type="button"
            class="unpublish-button" data-id="${proj.id}" ${isPublic ? "" : 'style="display:none;"'}>取消公开</button>
        </td>
      `;

      tbody.appendChild(tr);
    });

    document.querySelectorAll(".edit-button").forEach((button) => {
      button.addEventListener("click", (e) => {
        const editId = e.target.getAttribute("data-id");
        sessionStorage.setItem("editingProjectId", editId);
        location.href = `modify_project.html?id=${editId}`;
      });
    });

    document.querySelectorAll(".delete-button").forEach((button) => {
      button.addEventListener("click", async (e) => {
        const deleteId = e.target.getAttribute("data-id");
        if (!confirm("确定要删除该项目吗？")) return;

        try {
          const resp = await fetch(
            `/api/projects/${encodeURIComponent(deleteId)}`,
            { method: "DELETE" }
          );
          if (!resp.ok) {
            console.error("删除失败:", resp.status, await resp.text());
            pop_up("删除失败，请检查网络连接", "r");
            return;
          }

          await loadProjectList();
          pop_up("已删除项目", "g");
        } catch (err) {
          console.error("调用后端接口出错（DELETE /projects）:", err);
          pop_up("删除时连接服务器出错，请检查网络连接", "r");
        }
      });
    });

    document.querySelectorAll(".publish-button").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.currentTarget.getAttribute("data-id");
        try {
          const resp = await fetch(
            `/api/projects/${encodeURIComponent(id)}/publish`,
            { method: "POST" }
          );
          if (!resp.ok) {
            console.error("设为公开失败:", resp.status, await resp.text());
            pop_up("设为公开失败，请检查网络连接", "r");
            return;
          }
          await loadProjectList();
          pop_up("项目已设为公开", "g");
        } catch (err) {
          console.error("调用后端接口出错（POST /publish）:", err);
          pop_up("设为公开时连接服务器出错", "r");
        }
      });
    });

    document.querySelectorAll(".unpublish-button").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        const id = e.currentTarget.getAttribute("data-id");
        try {
          const resp = await fetch(
            `/api/projects/${encodeURIComponent(id)}/unpublish`,
            { method: "POST" }
          );
          if (!resp.ok) {
            console.error("取消公开失败:", resp.status, await resp.text());
            pop_up("取消公开失败，请检查网络连接", "r");
            return;
          }
          await loadProjectList();
          pop_up("项目已取消公开", "g");
        } catch (err) {
          console.error("调用后端接口出错（POST /unpublish）:", err);
          pop_up("取消公开时连接服务器出错", "r");
        }
      });
    });

    document.getElementById("pageIndicator").textContent = `第 ${currentPage} 页`;
    document.getElementById("prevPage").style.display =
      currentPage > 1 ? "inline-block" : "none";
    document.getElementById("nextPage").style.display =
      currentPage < totalPages ? "inline-block" : "none";
    document.querySelector(".pagination-container").style.display =
      totalPages > 1 ? "flex" : "none";
  }

  document.getElementById("newProjectBtn").addEventListener("click", () => {
    const newId = "proj_" + Date.now();
    sessionStorage.setItem("editingProjectId", newId);
    const cu = JSON.parse(sessionStorage.getItem("currentUser") || "null");
    sessionStorage.setItem("pendingAuthorId", (cu && cu.id) || "anonymous");
    sessionStorage.setItem("pendingAuthorName", (cu && cu.username) || "未知用户");

    location.href = `modify_project.html?id=${newId}`;
  });

  document.addEventListener("DOMContentLoaded", loadProjectList);

</script>

</html>
