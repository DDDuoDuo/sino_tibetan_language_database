<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/global.css?v=20251214">
  <script src="js/config.js?v=20251214"></script>
  <script src="js/auth.js?v=20251214"></script>
  <script src="js/warning.js?v=20251214"></script>
  <script src="js/i18n.js?v=20251214"></script>
  <script src="js/theme.js?v=20251214"></script>
  <script src="js/footer.js?v=20251214"></script>
  <title>汉藏语分化时间数据库</title>
  <style>
    body {
        color: var(--text-main);
        scrollbar-color: var(--text-muted) var(--bg-color); 
    }

    .project-list-header {
        max-width: 1200px;
        margin: 40px auto 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 20px;
    }

    .project-list-title {
        font-size: 22px;
        font-weight: bold;
        background: linear-gradient(90deg, #60a5fa 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .project-list-header .project-list-title {
        margin: 0;
    }

    .contributor-search {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 16px;
        border: 1px solid var(--border-color);
        border-radius: 99px;
        background: var(--surface-color);
        transition: border-color 0.2s;
    }

    .contributor-search:focus-within {
        border-color: var(--primary-blue);
    }

    .contributor-search input {
        border: none;
        outline: none;
        width: 100%;
        font-size: 14px;
        background: transparent;
        color: var(--text-main);
    }

    .contributor-search button {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 20px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
    }

    .contributor-search button:hover {
        color: var(--text-main);
    }

    .project-list-container {
        max-width: 1200px;
        margin: 0 auto 80px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background-color: var(--bg-color);
        overflow: hidden;
        box-shadow: 0 4px 20px var(--shadow-color);
    }

    .project-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    .project-table th {
        background-color: var(--surface-color);
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.05em;
        padding: 16px;
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        border-right: none;
        border-left: none;
        border-top: none;
    }

    .project-table td {
        padding: 16px;
        color: var(--text-main);
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        border-right: none;
        border-left: none;
    }
    
    .project-table tbody tr {
        transition: background-color 0.2s;
    }

    .view-btn {
        padding: 6px 16px;
        background-color: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-main);
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
    }
    
    .view-btn:hover {
        border-color: var(--primary-blue);
        color: var(--primary-blue);
        background-color: rgba(59, 130, 246, 0.05);
    }

    .pagination-container {
        display: none;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
        gap: 16px;
        color: var(--text-muted);
    }

    .page-btn {
        padding: 8px 16px;
        background-color: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        cursor: pointer;
        transition: all 0.2s;
    }
    
    .page-btn:hover:not(:disabled) {
        border-color: var(--text-muted);
    }

    .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
  </style>
</head>

<body>
    <header>
      <div class="logo">
        <img id="logo" src="img/EdUHK_logo.png" href="index.html" alt="香港教育大学 Logo">
      </div>
  
      <div class="menu">
        <nav>
          <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="language_map.html">研究</a></li>
            <li><a href="contribute.html" class="active">贡献者</a></li>
          </ul>
        </nav>
      </div>
  
      <div class="header-right">
        <button id="themeToggle" class="theme-toggle-btn" title="切换主题">
            <img id="themeIconImg" src="img/theme.png" alt="Theme">
        </button>

        <div class="profile" id="profile">
            <img id="profileImg" src="img/profile.png" alt="头像">
            <span class="profile-name" id="userStatus">登录</span>
        </div>
      </div>
  
      <div id="dropdownMenu" class="dropdown-menu" style="display: none;">
          <a href="account.html">我的账户</a>
          <a href="projects.html">管理项目</a>
          <button class="dropdown-link" id="logoutBtn">退出登录</button>
      </div>
    </header>

    <div class="project-list-header">
        <div class="project-list-title">贡献者列表</div>

        <div class="contributor-search">
            <input id="contributorSearchInput"
                type="text"
                placeholder="搜索用户名 / 工作单位…"
                autocomplete="off">
            <button id="contributorSearchClear" type="button" title="清空">×</button>
        </div>
    </div>

    <div class="project-list-container">
        <table class="project-table">
            <thead>
                <tr>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>工作单位</th>
                    <th>账户类型</th>
                    <th>加入时间</th>
                    <th>项目数量</th>
                    <th>词汇数量</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="contributors-table-body"></tbody>
        </table>

        <div class="pagination-container">
            <button type="button" id="prevPage" class="page-btn">←</button>
            <span id="pageIndicator">第 1 页</span>
            <button type="button" id="nextPage" class="page-btn">→</button>
        </div>
    </div>

    <div id="authContainer"></div>
</body>

<script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    const logo = document.getElementById('logo');
    const htmlEl = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
        setDarkTheme();
    } else {
        setLightTheme();
    }

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
        if (htmlEl.getAttribute('data-theme') === 'dark') {
            setLightTheme();
            localStorage.setItem('theme', 'light');
        } else {
            setDarkTheme();
            localStorage.setItem('theme', 'dark');
        }
        });
    }

    function setDarkTheme() {
        htmlEl.setAttribute('data-theme', 'dark');
        if (moonIcon) moonIcon.style.display = 'none';
        if (sunIcon) sunIcon.style.display = 'block';
        if (logo) logo.src = "img/EdUHK_logo_dark.png";
    }

    function setLightTheme() {
        htmlEl.removeAttribute('data-theme');
        if (moonIcon) moonIcon.style.display = 'block';
        if (sunIcon) sunIcon.style.display = 'none';
        if (logo) logo.src = "img/EdUHK_logo.png"; 
    }

    let currentPage = 1;
    const perPage = 10;
    let totalCount = 0;

    let searchTerm = "";

    function tx(key, fallback, vars = {}) {
        return window.I18N ? I18N.t(key, fallback, vars) : fallback.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? `{${k}}`);
    }

    async function loadContributors(page = 1) {
        const tbody = document.getElementById("contributors-table-body");
        const pageIndicator = document.getElementById("pageIndicator");
        const prevBtn = document.getElementById("prevPage");
        const nextBtn = document.getElementById("nextPage");
        const pager = document.querySelector(".pagination-container");

        if (!tbody) return;

        try {
            const resp = await fetch(`${API_BASE}/contributors?page=${page}&perPage=${perPage}`);

            if (!resp.ok) {
                const text = await resp.text();
                console.error("加载贡献者失败:", resp.status, text);
                pop_up(tx("contributors.loadFailed", "加载贡献者失败，请检查网络连接"), "r");
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">${escHTML(tx("contributors.messages.loadGenericFailed", "加载失败"))}</td></tr>`;
                return;
            }

            const data = await resp.json();
            const list = Array.isArray(data.contributors) ? data.contributors : [];
            const q = (searchTerm || "").trim().toLowerCase();
            const filtered = !q ? list : list.filter(u => {
                const name = (u.username || "").toLowerCase();
                const work = (u.workplace || "").toLowerCase();
                return name.includes(q) || work.includes(q);
            });
            totalCount = Number(data.total || 0);
            currentPage = Number(data.page || page);

            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: #888;">${escHTML(tx("contributors.empty", "暂无贡献者"))}</td></tr>`;
                pageIndicator.textContent = tx("common.pagination.page", "第 {page} 页", { page: currentPage });
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = true;
                return;
            }

            tbody.innerHTML = "";
            filtered.forEach(u => {
                const workplace = (u.workplace && String(u.workplace).trim()) ? u.workplace : "--";
                const createdAt = u.createdAt || "--";
                const projectCount = u.projectCount ?? 0;
                const vocabCount = u.vocabCount ?? 0;
                const accountType = u.accountType === "admin"
                    ? tx("contributors.accountTypes.admin", "管理员")
                    : tx("contributors.accountTypes.user", "普通用户");
                const isTargetAdmin = u.accountType === "admin";
                const adminLabel = isTargetAdmin
                    ? tx("contributors.actions.unsetAdmin", "取消管理员")
                    : tx("contributors.actions.setAdmin", "设为管理员");
                const adminAction = Auth.isAdmin()
                    ? `<button type="button" class="view-btn account-type-btn" data-id="${escHTML(u.id)}" data-next="${isTargetAdmin ? "user" : "admin"}">${escHTML(adminLabel)}</button>`
                    : "";

                const action = `<button type="button" class="view-btn contributor-view-btn" data-user="${escHTML(u.username)}">${escHTML(tx("common.actions.view", "查看"))}</button>${adminAction}`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${escHTML(u.username || "--")}</td>
                    <td>${escHTML(u.email || "--")}</td>
                    <td>${escHTML(workplace)}</td>
                    <td>${accountType}</td>
                    <td>${escHTML(createdAt)}</td>
                    <td>${escHTML(projectCount)}</td>
                    <td>${escHTML(vocabCount)}</td>
                    <td>${action}</td>
                `;
                tbody.appendChild(tr);
            });

            tbody.querySelectorAll(".contributor-view-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const user = btn.getAttribute("data-user");
                    window.location.href = `language_map.html?author=${encodeURIComponent(user)}`;
                });
            });

            tbody.querySelectorAll(".account-type-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const userId = btn.getAttribute("data-id");
                    const next = btn.getAttribute("data-next");
                    if (confirm(tx("contributors.messages.updateConfirm", "确定要修改此用户的帐户类型？"))) {
                        try {
                            const resp = await apiFetch(`${API_BASE}/contributors/${encodeURIComponent(userId)}/account-type`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ accountType: next })
                            });
                            const data = await resp.json();
                            if (!resp.ok || !data.success) {
                                pop_up(data.message || tx("contributors.messages.updateFailed", "设置账户类型失败"), "r");
                                return;
                            }
                            pop_up(tx("contributors.messages.updateSuccess", "账户类型已更新"), "g");
                            loadContributors(currentPage);
                        } catch (err) {
                            console.error("设置账户类型出错:", err);
                            pop_up(tx("contributors.messages.updateNetworkFailed", "设置账户类型失败，请检查网络连接"), "r");
                        }
                    }
                });
            });

            const totalPages = Math.max(1, Math.ceil(totalCount / perPage));
            if (pager) pager.style.display = totalPages > 1 ? "flex" : "none";
            pageIndicator.textContent = tx("common.pagination.pageOfTotal", "第 {page} 页 / 共 {totalPages} 页", {
                page: currentPage,
                totalPages
            });

            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

        } catch (err) {
            console.error("加载贡献者出错:", err);
            pop_up(tx("contributors.loadFailed", "加载贡献者失败，请检查网络连接"), "r");
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: #888;">${escHTML(tx("contributors.messages.loadGenericFailed", "加载失败"))}</td></tr>`;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const authReady = Auth.init('#userStatus');
        Auth.bindProfileName('#userStatus');
    
        const profile = document.getElementById("profile");
        const dropdown = document.getElementById("dropdownMenu");
        if (profile && dropdown) {
            profile.addEventListener('click', () => {
                if (Auth.isLoggedIn()) {
                    dropdown.style.display = (dropdown.style.display === "none" || !dropdown.style.display)
                    ? "block" : "none";
                } else {
                    Auth.showLogin();
                }
            });
    
            document.addEventListener("click", (e) => {
                if (!profile.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.style.display = "none";
                }
            });
        }
    
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                Auth.logout();
                pop_up("已退出登录");
                setTimeout(() => {
                    window.location.href = "contribute.html?logout=true";
                }, 100);
            });
        }

        document.getElementById("prevPage")?.addEventListener("click", () => {
            if (currentPage > 1) loadContributors(currentPage - 1);
        });

        document.getElementById("nextPage")?.addEventListener("click", () => {
            loadContributors(currentPage + 1);
        });

        const searchInput = document.getElementById("contributorSearchInput");
        const clearBtn = document.getElementById("contributorSearchClear");

        if (searchInput) {
            searchInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    searchTerm = searchInput.value || "";
                    loadContributors(1);
                }
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener("click", () => {
                searchTerm = "";
                if (searchInput) searchInput.value = "";
                loadContributors(1);
                searchInput?.focus();
            });
        }

        document.addEventListener("auth:changed", () => loadContributors(currentPage));
        document.addEventListener("i18n:changed", () => loadContributors(currentPage));
        Promise.resolve(authReady).finally(() => loadContributors(1));
    });
</script>
  
</html>
